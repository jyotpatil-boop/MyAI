name: Build MyAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

  

      - name: Extract and build
        run: |
          unzip -q MyAI-Android-Starter.zip -d source
          cd source/MyAI-Android-Starter
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle*
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyAI-APK
          path: source/MyAI-Android-Starter/app/build/outputs/apk/debug/app-debug.apk
